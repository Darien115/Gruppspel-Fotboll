<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fotbollsturnering</title>

<style>
body{font-family:Arial;background:#1f6a39;color:#e5e7eb;padding:20px}
.group{background:#0b3019;border-radius:12px;padding:12px;margin-bottom:16px}
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
table{width:100%;border-collapse:collapse;margin-top:8px}
th,td{border-bottom:1px solid #334155;padding:6px;text-align:center}
input{background:transparent;color:#e5e7eb;border:none}
input.score{width:40px;text-align:center}
.match{display:flex;justify-content:center;gap:6px;margin:4px 0}
h2{text-align:center}
</style>
</head>

<body>

<h1 style="text-align:center">Fotbollsturnering ⚽</h1>

<div id="groups" class="groups"></div>

<div class="group">
<h2>🏆 Prispall</h2>
<p>🥇 <strong id="gold">–</strong></p>
<p>🥈 <strong id="silver">–</strong></p>
<p>🥉 <strong id="bronze">–</strong></p>
</div>

<div class="group">
<h2>Slutspel</h2>
<table>
<thead><tr><th>Match</th><th>Lag A</th><th></th><th>Lag B</th><th>Resultat</th></tr></thead>
<tbody id="knockout"></tbody>
</table>
</div>

<script>
const GROUPS = 4, TEAMS = 4;
const groupsEl = document.getElementById("groups");

function saveState(){
  localStorage.setItem("tournament",JSON.stringify(
    Array.from(document.querySelectorAll("input")).map(i=>i.value)
  ));
}

function loadState(){
  const d = JSON.parse(localStorage.getItem("tournament")||"null");
  if(!d) return;
  document.querySelectorAll("input").forEach((i,n)=>i.value=d[n]||"");
}

function createGroup(i){
  const g=document.createElement("div");
  g.className="group";
  const teams=[...Array(TEAMS)].map((_,n)=>`Lag ${i*4+n+1}`);
  g.innerHTML=`
  <h2><input value="Grupp ${String.fromCharCode(65+i)}"></h2>
  <table>
  <thead><tr><th>Lag</th><th>V</th><th>O</th><th>F</th><th>P</th></tr></thead>
  <tbody>
  ${teams.map(t=>`
  <tr data-team="${t}">
    <td><input value="${t}"></td>
    <td class=v>0</td><td class=o>0</td><td class=f>0</td><td class=p>0</td>
  </tr>`).join("")}
  </tbody></table>
  <div>${matches(teams)}</div>`;
  g.querySelectorAll("input").forEach(i=>i.oninput=()=>{updateGroup(g);saveState();});
  return g;
}

function matches(t){
 let h="";
 for(let i=0;i<t.length;i++)
 for(let j=i+1;j<t.length;j++)
 h+=`<div class=match>
 <span class=t1>${t[i]}</span>
 <input class=score>
 -
 <input class=score>
 <span class=t2>${t[j]}</span>
 </div>`;
 return h;
}

function updateGroup(g){
 const rows=[...g.querySelectorAll("tbody tr")];
 const stats={};
 rows.forEach(r=>stats[r.children[0].firstChild.value]={v:0,o:0,f:0,p:0,row:r});
 g.querySelectorAll(".match").forEach(m=>{
  const t1=m.querySelector(".t1").textContent;
  const t2=m.querySelector(".t2").textContent;
  const s1=+m.children[1].value,s2=+m.children[3].value;
  if(isNaN(s1)||isNaN(s2))return;
  if(s1>s2){stats[t1].v++;stats[t1].p+=3;stats[t2].f++;}
  else if(s2>s1){stats[t2].v++;stats[t2].p+=3;stats[t1].f++;}
  else{stats[t1].o++;stats[t2].o++;stats[t1].p++;stats[t2].p++;}
 });
 Object.values(stats).forEach(s=>{
  s.row.querySelector(".v").textContent=s.v;
  s.row.querySelector(".o").textContent=s.o;
  s.row.querySelector(".f").textContent=s.f;
  s.row.querySelector(".p").textContent=s.p;
 });
 updateKnockout();
}

function qualified(){
 const q=[];
 document.querySelectorAll(".group tbody").forEach(t=>{
  const r=[...t.querySelectorAll("tr")]
   .map(r=>({n:r.children[0].firstChild.value,p:+r.querySelector(".p").textContent}))
   .sort((a,b)=>b.p-a.p);
  q.push(r[0],r[1]);
 });
 return q;
}

function updateKnockout(){
 const k=document.getElementById("knockout");
 const q=qualified();
 k.innerHTML="";
 const m=(n,a,b,id)=>`
 <tr data-id=${id}>
 <td>${n}</td><td class=a>${a||""}</td><td>vs</td><td class=b>${b||""}</td>
 <td><input class=score>-<input class=score></td></tr>`;
 k.innerHTML+=m("Kvart 1",q[0]?.n,q[1]?.n,"q1");
 k.innerHTML+=m("Kvart 2",q[2]?.n,q[3]?.n,"q2");
 k.innerHTML+=m("Kvart 3",q[4]?.n,q[5]?.n,"q3");
 k.innerHTML+=m("Kvart 4",q[6]?.n,q[7]?.n,"q4");
 k.innerHTML+=m("Semi 1","","","s1");
 k.innerHTML+=m("Semi 2","","","s2");
 k.innerHTML+=m("Brons","","","b");
 k.innerHTML+=m("Final","","","f");
 k.querySelectorAll("input").forEach(i=>i.oninput=()=>{calcKO();saveState();});
}

function winner(r){
 const s=[...r.querySelectorAll("input")].map(i=>+i.value);
 if(s.some(isNaN)||s[0]==s[1])return null;
 return s[0]>s[1]?r.querySelector(".a").textContent:r.querySelector(".b").textContent;
}
function loser(r){
 const s=[...r.querySelectorAll("input")].map(i=>+i.value);
 if(s.some(isNaN)||s[0]==s[1])return null;
 return s[0]<s[1]?r.querySelector(".a").textContent:r.querySelector(".b").textContent;
}

function calcKO(){
 const r={};
 document.querySelectorAll("#knockout tr").forEach(x=>r[x.dataset.id]=x);
 r.s1.querySelector(".a").textContent=winner(r.q1)||"";
 r.s1.querySelector(".b").textContent=winner(r.q2)||"";
 r.s2.querySelector(".a").textContent=winner(r.q3)||"";
 r.s2.querySelector(".b").textContent=winner(r.q4)||"";
 r.f.querySelector(".a").textContent=winner(r.s1)||"";
 r.f.querySelector(".b").textContent=winner(r.s2)||"";
 r.b.querySelector(".a").textContent=loser(r.s1)||"";
 r.b.querySelector(".b").textContent=loser(r.s2)||"";
 document.getElementById("gold").textContent=winner(r.f)||"–";
 document.getElementById("silver").textContent=loser(r.f)||"–";
 document.getElementById("bronze").textContent=winner(r.b)||"–";
}

for(let i=0;i<GROUPS;i++){const g=createGroup(i);groupsEl.appendChild(g);updateGroup(g);}
setTimeout(()=>{loadState();document.querySelectorAll(".group").forEach(updateGroup);calcKO();},0);
</script>

</body>
</html>
