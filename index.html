<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gruppspel – 16 lag (Matchinmatning)</title>
  <style>
    body { font-family: Arial, sans-serif; background:#0f172a; color:#e5e7eb; padding:20px; }
    h1 { margin-bottom: 10px; }
    .groups { display:grid; grid-template-columns: repeat(auto-fit, minmax(360px,1fr)); gap:16px; }
    .group { background:#020617; border-radius:12px; padding:12px; box-shadow:0 10px 20px rgba(0,0,0,.3); }
    .group h2 input { width:100%; font-size:18px; background:transparent; color:#e5e7eb; border:none; border-bottom:1px solid #334155; }
    table { width:100%; border-collapse: collapse; margin-top:10px; }
    th, td { border-bottom:1px solid #334155; padding:6px; text-align:center; }
    th { font-size:12px; color:#94a3b8; }
    td.name input { width:100%; background:transparent; color:#e5e7eb; border:none; }
    input.score { width:40px; text-align:center; }
    .matches { margin-top:10px; }
    .match { display:flex; align-items:center; justify-content:space-between; gap:6px; margin-bottom:6px; }
    .match span { flex:1; text-align:center; font-size:12px; }
  </style>
</head>
<body>
  <h1>Gruppspel – Matchinmatning</h1>
  <div class="groups" id="groups"></div>

  <script>
    // ===== SPARA / LADDA DATA (LocalStorage) =====
    const STORAGE_KEY = 'fotbollsturnering_v1';

    function saveState() {
      const data = {
        groups: [...document.querySelectorAll('.group[data-type="group"]')].map(g => ({
          groupName: g.querySelector('h2 input').value,
          teams: [...g.querySelectorAll('tbody tr')].map(r => ({
            name: r.querySelector('td.name input').value,
            matches: []
          })),
          matches: [...g.querySelectorAll('.match')].map(m => ({
            s1: m.querySelector('.s1').value,
            s2: m.querySelector('.s2').value
          }))
        })),
        knockout: [...document.querySelectorAll('#knockout-body tr')].map(r => ({
          id: r.dataset.id,
          s1: r.querySelector('.ks1')?.value || '',
          s2: r.querySelector('.ks2')?.value || ''
        }))
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function loadState() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      const data = JSON.parse(raw);

      const groups = [...document.querySelectorAll('.group[data-type="group"]')];
      data.groups.forEach((g,i) => {
        if (!groups[i]) return;
        groups[i].querySelector('h2 input').value = g.groupName;
        g.teams.forEach((t,j) => {
          const row = groups[i].querySelectorAll('tbody tr')[j];
          if (row) row.querySelector('td.name input').value = t.name;
        });
        g.matches.forEach((m,j) => {
          const match = groups[i].querySelectorAll('.match')[j];
          if (!match) return;
          match.querySelector('.s1').value = m.s1;
          match.querySelector('.s2').value = m.s2;
        });
        updateGroup(groups[i]);
      });

      const rows = [...document.querySelectorAll('#knockout-body tr')];
      data.knockout.forEach((k,i) => {
        if (!rows[i]) return;
        rows[i].querySelector('.ks1').value = k.s1;
        rows[i].querySelector('.ks2').value = k.s2;
      });
      calculateKnockout();
    }

    const GROUP_COUNT = 4;
    const TEAMS_PER_GROUP = 4;
    const groupsEl = document.getElementById('groups');

    function createGroup(index) {
      const group = document.createElement('div');
      group.dataset.type = 'group';
      group.className = 'group';

      const teamNames = Array.from({length: TEAMS_PER_GROUP}).map((_,i)=>`Lag ${index*TEAMS_PER_GROUP+i+1}`);

      group.innerHTML = `
        <h2><input value="Grupp ${String.fromCharCode(65+index)}" /></h2>
        <table>
          <thead>
            <tr><th>Lag</th><th>V</th><th>O</th><th>F</th><th>P</th></tr>
          </thead>
          <tbody>
            ${teamNames.map(name=>`
              <tr data-team="${name}">
                <td class="name"><input value="${name}" /></td>
                <td class="v">0</td>
                <td class="o">0</td>
                <td class="f">0</td>
                <td class="p">0</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
        <div class="matches">
          <strong>Matcher</strong>
          ${createMatches(teamNames)}
        </div>
      `;

      group.querySelectorAll('.match input').forEach(inp => inp.addEventListener('input', () => { updateGroup(group); saveState(); })(group)));
      group.querySelectorAll('td.name input').forEach(inp => inp.addEventListener('input', () => updateGroup(group)));

      return group;
    }

    function createMatches(teams) {
      let html = '';
      for (let i=0;i<teams.length;i++) {
        for (let j=i+1;j<teams.length;j++) {
          html += `
            <div class="match">
              <span class="t1">${teams[i]}</span>
              <input type="number" class="score s1" min="0" />
              <span>-</span>
              <input type="number" class="score s2" min="0" />
              <span class="t2">${teams[j]}</span>
            </div>`;
        }
      }
      return html;
    }

    function updateGroup(group) {
      const rows = [...group.querySelectorAll('tbody tr')];
      const stats = {};

      rows.forEach(r => {
        const name = r.querySelector('td.name input').value;
        stats[name] = { v:0, o:0, f:0, p:0, row:r };
      });

      group.querySelectorAll('.match').forEach(m => {
        const t1 = m.querySelector('.t1').textContent;
        const t2 = m.querySelector('.t2').textContent;
        const s1 = parseInt(m.querySelector('.s1').value);
        const s2 = parseInt(m.querySelector('.s2').value);

        if (isNaN(s1) || isNaN(s2)) return;

        if (s1 > s2) {
          stats[t1].v++; stats[t1].p+=3;
          stats[t2].f++;
        } else if (s1 < s2) {
          stats[t2].v++; stats[t2].p+=3;
          stats[t1].f++;
        } else {
          stats[t1].o++; stats[t2].o++;
          stats[t1].p++; stats[t2].p++;
        }
      });

      Object.values(stats).forEach(s => {
        s.row.querySelector('.v').textContent = s.v;
        s.row.querySelector('.o').textContent = s.o;
        s.row.querySelector('.f').textContent = s.f;
        s.row.querySelector('.p').textContent = s.p;
      });

      // uppdatera slutspelet när grupper ändras
      updateKnockout();
    }

    for (let i=0;i<GROUP_COUNT;i++) {
      const g = createGroup(i);
      groupsEl.appendChild(g);
      updateGroup(g);
    }
    // ===== SLUTSPEL =====
    function createKnockout() {
      const knockout = document.createElement('div');
      knockout.dataset.type = 'knockout';
      knockout.className = 'group';
      knockout.innerHTML = `
        <h2>Slutspel</h2>
        <div id="podium" style="margin:12px 0;padding:12px;border-radius:12px;background:#020617;text-align:center">
          <h3>🏆 Prispall</h3>
          <div style="display:flex;justify-content:center;gap:20px;margin-top:10px">
            <div style="background:#ca8a04;padding:10px;border-radius:8px;min-width:120px">🥇<br><strong id="gold">–</strong></div>
            <div style="background:#9ca3af;padding:10px;border-radius:8px;min-width:120px">🥈<br><strong id="silver">–</strong></div>
            <div style="background:#92400e;padding:10px;border-radius:8px;min-width:120px">🥉<br><strong id="bronze">–</strong></div>
          </div>
        </div>
        <table>
          <thead>
            <tr><th>Runda</th><th>Lag 1</th><th></th><th>Lag 2</th><th>Resultat</th></tr>
          </thead>
          <tbody id="knockout-body"></tbody>
        </table>`;
      document.body.appendChild(knockout);
      updateKnockout();
    }

    function getQualifiedTeams() {
      const qualified = [];
      // Endast gruppspelsgrupper (inte slutspelet)
      document.querySelectorAll('.group[data-type="group"] tbody').forEach(tbody => {
        const rows = [...tbody.querySelectorAll('tr')];
        const teams = rows.map(r => ({
          name: r.querySelector('td.name input').value,
          points: parseInt(r.querySelector('.p').textContent)
        })).sort((a,b)=>b.points-a.points);
        qualified.push(teams[0], teams[1]);
      });
      return qualified;
    }

    function matchRow(round, t1, t2, id) {
      return `
        <tr data-id="${id}">
          <td>${round}</td>
          <td class="t1">${t1||''}</td>
          <td>vs</td>
          <td class="t2">${t2||''}</td>
          <td>
            <input type="number" class="ks1" style="width:40px"> -
            <input type="number" class="ks2" style="width:40px">
            <span class="medal" style="margin-left:8px;font-weight:bold"></span>
          </td>
        </tr>`;
    }

    function updateKnockout() {
      const body = document.getElementById('knockout-body');
      if (!body) return;

      const q = getQualifiedTeams();
      body.innerHTML = '';

      // Kvartsfinaler
      body.innerHTML += matchRow('Kvartsfinal 1', q[0]?.name, q[1]?.name, 'q1');
      body.innerHTML += matchRow('Kvartsfinal 2', q[2]?.name, q[3]?.name, 'q2');
      body.innerHTML += matchRow('Kvartsfinal 3', q[4]?.name, q[5]?.name, 'q3');
      body.innerHTML += matchRow('Kvartsfinal 4', q[6]?.name, q[7]?.name, 'q4');

      // Semifinaler
      body.innerHTML += matchRow('Semifinal 1', '', '', 's1');
      body.innerHTML += matchRow('Semifinal 2', '', '', 's2');

      // Bronsmatch
      body.innerHTML += matchRow('Bronsmatch', '', '', 'b');

      // Final
      body.innerHTML += matchRow('Final', '', '', 'f');

      body.querySelectorAll('input').forEach(i => i.addEventListener('input', () => { calculateKnockout(); saveState(); })));
    }

    function getWinner(row) {
      const s1 = parseInt(row.querySelector('.ks1').value);
      const s2 = parseInt(row.querySelector('.ks2').value);
      if (isNaN(s1) || isNaN(s2)) return null;
      if (s1 > s2) return row.querySelector('.t1').textContent;
      if (s2 > s1) return row.querySelector('.t2').textContent;
      return null;
    }

    function getLoser(row) {
      const s1 = parseInt(row.querySelector('.ks1').value);
      const s2 = parseInt(row.querySelector('.ks2').value);
      if (isNaN(s1) || isNaN(s2)) return null;
      if (s1 > s2) return row.querySelector('.t2').textContent;
      if (s2 > s1) return row.querySelector('.t1').textContent;
      return null;
    }

    function calculateKnockout() {
      const rows = Object.fromEntries([...document.querySelectorAll('#knockout-body tr')].map(r=>[r.dataset.id,r]));

      // Semifinaler
      rows.s1.querySelector('.t1').textContent = getWinner(rows.q1) || '';
      rows.s1.querySelector('.t2').textContent = getWinner(rows.q2) || '';

      rows.s2.querySelector('.t1').textContent = getWinner(rows.q3) || '';
      rows.s2.querySelector('.t2').textContent = getWinner(rows.q4) || '';

      // Final
      rows.f.querySelector('.t1').textContent = getWinner(rows.s1) || '';
      rows.f.querySelector('.t2').textContent = getWinner(rows.s2) || '';

      // Bronsmatch
      rows.b.querySelector('.t1').textContent = getLoser(rows.s1) || '';
      rows.b.querySelector('.t2').textContent = getLoser(rows.s2) || '';

      // Medaljer
      const fWinner = getWinner(rows.f);
      const fLoser = getLoser(rows.f);
      const bWinner = getWinner(rows.b);

      document.querySelectorAll('.medal').forEach(m=>m.textContent='');

      if (fWinner) rows.f.querySelector('.medal').textContent = '🥇 ' + fWinner;
      if (fLoser) rows.f.querySelector('.medal').textContent += '  🥈 ' + fLoser;
      if (bWinner) rows.b.querySelector('.medal').textContent = '🥉 ' + bWinner;

      // Uppdatera prispall
      if (fWinner) document.getElementById('gold').textContent = fWinner;
      if (fLoser) document.getElementById('silver').textContent = fLoser;
      if (bWinner) document.getElementById('bronze').textContent = bWinner;('.medal').textContent = '🥉 ' + bWinner;
    }

    setTimeout(() => { createKnockout(); loadState(); }, 0);

  </script>
</body>
</html>
